name: Build Stryker APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - arena/**
    paths:
      - "stryker/**"
      - ".github/workflows/build-stryker-apk.yml"
  pull_request:
    branches:
      - main
    paths:
      - "stryker/**"

permissions:
  contents: write

jobs:
  build:
    name: Build Stryker Debug APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: stryker

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK components
        run: |
          SDKMANAGER="${ANDROID_SDK_ROOT:-$ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" "platforms;android-33" "build-tools;34.0.0" "ndk;25.1.8937393" "cmake;3.22.1" > /dev/null

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Stryker-debug-apk
          path: stryker/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Publish APK to rolling release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create stryker-apk-latest \
            --target "$GITHUB_SHA" \
            --title "Stryker debug APK (rolling)" \
            --notes "Automated debug build of stryker/ at commit $GITHUB_SHA" \
            --clobber || true
          gh release upload stryker-apk-latest \
            app/build/outputs/apk/debug/*.apk --clobber

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: stryker-build-failure-diagnostics
          path: |
            stryker/app/build/reports/
            stryker/terminal/build/reports/
          if-no-files-found: ignore
