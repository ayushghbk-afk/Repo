name: Build Stryker APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - arena/**
    paths:
      - "stryker/**"
      - ".github/workflows/build-stryker-apk.yml"
  pull_request:
    branches:
      - main
    paths:
      - "stryker/**"

permissions:
  contents: write

jobs:
  build:
    name: Build Stryker Debug APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: stryker

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK components
        run: |
          SDKMANAGER="${ANDROID_SDK_ROOT:-$ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" "platforms;android-33" "build-tools;34.0.0" "ndk;25.1.8937393" "cmake;3.22.1" > /dev/null

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Stryker-debug-apk
          path: stryker/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Publish APK to rolling release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=$(ls app/build/outputs/apk/debug/*.apk)
          set +e
          if ! gh release view stryker-apk-latest > /dev/null 2>&1; then
            gh release create stryker-apk-latest \
              --target "$GITHUB_SHA" \
              --title "Stryker debug APK (rolling)" \
              --notes "Automated debug build of stryker/ at commit $GITHUB_SHA" \
              --latest=false 2>&1 | tee publish.log
            status=${PIPESTATUS[0]}
            if [ $status -ne 0 ]; then exit $status; fi
          fi
          gh release upload stryker-apk-latest "$APK" --clobber 2>&1 | tee -a publish.log
          status=${PIPESTATUS[0]}
          set -e
          exit $status

      - name: Save publish log on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ROOT="$(git rev-parse --show-toplevel)"
          mkdir -p "$ROOT/.github/build-logs"
          if [ -f publish.log ]; then cp publish.log "$ROOT/.github/build-logs/stryker-publish.log"; else echo "publish.log was not created" > "$ROOT/.github/build-logs/stryker-publish.log"; fi
          git config user.name "stryker-ci-bot"
          git config user.email "actions@users.noreply.github.com"
          git -C "$ROOT" add .github/build-logs/stryker-publish.log
          git -C "$ROOT" commit -m "CI: record stryker publish failure log [skip stryker build]"
          git -C "$ROOT" pull --rebase origin "$GITHUB_REF_NAME"
          git -C "$ROOT" push origin "HEAD:$GITHUB_REF_NAME"

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: stryker-build-failure-diagnostics
          path: |
            stryker/app/build/reports/
            stryker/terminal/build/reports/
          if-no-files-found: ignore
