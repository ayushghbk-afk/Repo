name: Build Lenix APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - arena/**
    paths-ignore:
      - "stryker/**"
      - "ci-artifacts/**"
  pull_request:
    branches:
      - main
    paths-ignore:
      - "stryker/**"
      - "ci-artifacts/**"

permissions:
  contents: read

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Run unit tests
        shell: bash
        run: |
          set +e
          set -o pipefail
          ./gradlew testDebugUnitTest --no-daemon 2>&1 | tee gradle-test.log
          status=$?
          set -e
          if [ $status -ne 0 ]; then
            python3 - <<'PYEOF'
          import glob, xml.etree.ElementTree as ET
          shown = 0
          for path in sorted(glob.glob("app/build/test-results/**/*.xml", recursive=True)):
              try:
                  root = ET.parse(path).getroot()
              except Exception:
                  continue
              for case in root.iter("testcase"):
                  failure = case.find("failure")
                  if failure is None:
                      failure = case.find("error")
                  if failure is None:
                      continue
                  shown += 1
                  message = (failure.get("message") or "").strip().replace("\n", " ")[:400]
                  top = ""
                  for line in (failure.text or "").strip().splitlines():
                      line = line.strip()
                      if line.startswith("at com.lenix"):
                          top = line[:200]
                          break
                  print(f"::error title=JUnit failure {shown}::FAILED {case.get('classname')}.{case.get('name')} | {message} | {top}")
          if shown == 0:
              with open("gradle-test.log") as handle:
                  lines = handle.read().splitlines()
              interesting = [l for l in lines if l.startswith("e: ") or "FAILED" in l or "error:" in l.lower() or "> Task" in l][-30:]
              print("::error title=Gradle failure (no JUnit XML)::" + " || ".join(interesting)[:2000])
          PYEOF
          fi
          exit $status

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-failure-diagnostics
          path: |
            gradle-test.log
            app/build/test-results/
            app/build/reports/tests/
          if-no-files-found: ignore

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Lenix-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
