name: Probe remote MCP

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the temporary branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 1
      - name: Call MCP endpoint
        shell: bash
        env:
          MCP_URL: https://mysimon-undo-congressional-reliability.trycloudflare.com/mcp
        run: |
          set -euo pipefail
          mkdir -p probe
          init='{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"arena-probe","version":"1.0.0"}}}'
          list='{"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}'
          headers=probe/initialize.headers
          curl --fail-with-body --retry 3 --retry-all-errors --connect-timeout 20 --max-time 90 \
            -sS -D "$headers" -o probe/initialize.response \
            "$MCP_URL" \
            -H 'Accept: application/json, text/event-stream' \
            -H 'Content-Type: application/json' \
            --data-raw "$init"
          session="$(awk 'BEGIN{IGNORECASE=1} /^mcp-session-id:/ {sub(/^[^:]*:[[:space:]]*/, ""); gsub(/\r/, ""); print; exit}' "$headers")"
          {
            echo "session=${session:-<none>}"
            echo '--- response headers ---'
            cat "$headers"
          } > probe/metadata.txt
          if [[ -n "$session" ]]; then
            curl --fail-with-body --retry 3 --retry-all-errors --connect-timeout 20 --max-time 90 \
              -sS -D probe/tools-list.headers -o probe/tools-list.response \
              "$MCP_URL" \
              -H 'Accept: application/json, text/event-stream' \
              -H 'Content-Type: application/json' \
              -H "Mcp-Session-Id: $session" \
              --data-raw "$list"
          else
            curl --fail-with-body --retry 3 --retry-all-errors --connect-timeout 20 --max-time 90 \
              -sS -D probe/tools-list.headers -o probe/tools-list.response \
              "$MCP_URL" \
              -H 'Accept: application/json, text/event-stream' \
              -H 'Content-Type: application/json' \
              --data-raw "$list"
          fi
      - name: Publish probe response to the temporary branch
        shell: bash
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          cp probe/initialize.response ".mcp-probe-$RUN_ID.initialize.txt"
          cat probe/tools-list.response > ".mcp-probe-$RUN_ID.tools-list.txt"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ".mcp-probe-$RUN_ID.initialize.txt" ".mcp-probe-$RUN_ID.tools-list.txt"
          git commit -m "chore: record temporary MCP probe response ($RUN_ID)"
          git push origin "HEAD:$BRANCH"
      - name: Print MCP responses for retrieval
        shell: bash
        run: |
          echo '--- initialize response ---'
          cat probe/initialize.response
          echo
          echo '--- tools/list response ---'
          cat probe/tools-list.response
      - name: Upload MCP responses
        uses: actions/upload-artifact@v4
        with:
          name: remote-mcp-probe
          path: probe/
          if-no-files-found: error
