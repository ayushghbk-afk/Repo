# Project-wide Gradle settings
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# Android settings
android.useAndroidX=true
# Jetifier is off on purpose. Every dependency in this project is already AndroidX /
# Jetpack, Kotlin or plain Java, so nothing needs the legacy support-library bytecode
# rewrite, and running it does real harm: Jetifier's bundled ASM cannot read class
# file major version 65 (Java 21), which jackson-core 2.16+ ships under
# META-INF/versions/21 as part of its shaded FastDoubleParser multi-release jar.
# With Jetifier on, dependency resolution dies in JetifyTransform before Kotlin is
# even compiled. See docs/DECISIONS.md ADR-013.
android.enableJetifier=false

# Kotlin settings
kotlin.code.style=official
kotlin.incremental=true

# Non-transitive R classes
android.nonTransitiveRClass=true
